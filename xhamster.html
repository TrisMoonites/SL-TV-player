<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SL TV Player - RedTube & YouPorn Edition</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        #video-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
        }
        #tvplayer { 
            position: absolute;
            width: 100% !important; 
            height: 100% !important; 
            border: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.02);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="tvplayer" src="" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoParam = urlParams.get('v') || urlParams.get('id');
        let playerFrame = document.getElementById('tvplayer');

        if (videoParam) {
            videoParam = videoParam.trim();
            let targetSrc = "";

            // RedTube Erkennung
            if (videoParam.includes("redtube.com")) {
                let match = videoParam.match(/redtube\.com\/(\d+)/) || videoParam.match(/(\d+)/);
                let id = match ? match[1] : videoParam.replace(/\D/g, '');
                // Zusätzliche Parameter für erzwungenes Starten
                targetSrc = "https://embed.redtube.com/?id=" + id + "&autoplay=1&autostart=true&muted=0";
            } 
            // YouPorn Erkennung
            else if (videoParam.includes("youporn.com")) {
                let match = videoParam.match(/watch\/(\d+)/) || videoParam.match(/(\d+)/);
                let id = match ? match[1] : videoParam.replace(/\D/g, '');
                // YouPorn Embed-Struktur mit Autoplay
                targetSrc = "https://www.youporn.com/embed/" + id + "/?autoplay=1";
            } 
            // Falls direkt eine Embed-URL übergeben wurde
            else if (videoParam.startsWith("http://") || videoParam.startsWith("https://")) {
                targetSrc = videoParam;
                if (!targetSrc.includes("autoplay=")) {
                    targetSrc += (targetSrc.includes("?") ? "&" : "?") + "autoplay=1";
                }
            } 
            // Fallback (reine Zahlen-ID -> RedTube)
            else {
                let cleanId = videoParam.replace(/\D/g, '');
                targetSrc = "https://embed.redtube.com/?id=" + cleanId + "&autoplay=1&autostart=true";
            }

            playerFrame.src = targetSrc;
        }

        // Verhindert das Ausbrechen von Links in externe Browser
        var a = document.getElementsByTagName("a");
        for (var i = 0; i < a.length; i++) { 
            if (a[i].target === "_blank") a[i].target = "_self"; 
        }
    </script>
</body>
</html>
