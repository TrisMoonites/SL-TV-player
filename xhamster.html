<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SL TV Player</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #000; 
        }
        #video-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        }
        #tvplayer { 
            position: absolute; width: 100% !important; height: 100% !important; 
            border: none; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(1.02); 
        }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="tvplayer" src="" allow="autoplay *; encrypted-media *; fullscreen *;" allowfullscreen></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let rawParam = urlParams.get('v') || urlParams.get('id');
        let playerFrame = document.getElementById('tvplayer');

        if (rawParam) {
            let videoParam = decodeURIComponent(rawParam).trim();
            let targetSrc = "";

            // RedTube
            if (videoParam.includes("redtube.com") || videoParam.includes("rt.com")) {
                let match = videoParam.match(/(\d+)/);
                let id = match ? match[1] : videoParam;
                targetSrc = "https://embed.redtube.com/?id=" + id + "&autoplay=true&muted=true&autostart=true";
            } 
            // YouPorn
            else if (videoParam.includes("youporn.com") || videoParam.includes("yp.com")) {
                let match = videoParam.match(/watch\/(\d+)/) || videoParam.match(/(\d+)/);
                let id = match ? match[1] : videoParam;
                targetSrc = "https://www.youporn.com/embed/" + id + "/?autoplay=true&muted=true&autostart=true";
            } 
            // Direkt-ID oder unkodierter Link Fallback
            else {
                let cleanId = videoParam.replace(/\D/g, '');
                targetSrc = "https://embed.redtube.com/?id=" + cleanId + "&autoplay=true&muted=true&autostart=true";
            }

            // IFrame laden
            playerFrame.src = targetSrc;
        }

        // verhindert Ausbrechen des Links
        var a = document.getElementsByTagName("a");
        for (let i = 0; i < a.length; i++) { 
            if (a[i].target === "_blank") a[i].target = "_self"; 
        }
    </script>
</body>
</html>
