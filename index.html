<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Loop Edition (Proxy Fix)</title>
   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    iframe { 
        position: absolute;
        width: 100% !important; 
        height: 100% !important; 
        border: none;
        top: 50%;
        left: 50%;
        /* Dein bewährter Zoom-Trick für das Second Life Seitenverhältnis */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <div id="video-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vID = urlParams.get('v');
        const listID = urlParams.get('list');

        let embedUrl = "";
        
        // NEUER SERVER: iv.melmac.space blockiert Bots nicht via Cloudflare.
        // Falls dieser mal überlastet ist, kannst du ihn durch "https://nerdvpn.de" ersetzen.
        const baseDomain = "https://melmac.space";

        if (listID) {
            // Unterstützung für echte YouTube Playlists (list=)
            const cleanList = listID.replace('list=', '');
            embedUrl = baseDomain + "/embed/playlist?list=" + cleanList + "&autoplay=1";
        } else if (vID) {
            if (vID.includes(',')) {
                // Unterstützung für Listen aus Notecards (v=ID1,ID2,ID3)
                const ids = vID.split(',');
                embedUrl = baseDomain + "/embed/" + ids + "?autoplay=1&loop=1";
            } else if (vID.length < 15) {
                // Standard Einzelvideo-Loop
                embedUrl = baseDomain + "/embed/" + vID + "?autoplay=1&loop=1";
            } else {
                // Unterstützung für die Suchfunktion
                if (vID.startsWith("/watch?v=")) {
                    embedUrl = baseDomain + "/embed/" + vID.split('v=') + "?autoplay=1";
                } else {
                    embedUrl = baseDomain + "/embed/" + vID + "?autoplay=1";
                }
            }
        }

        if (embedUrl) {
            // Generiert den funktionierenden Iframe für deinen Inworld-Monitor
            document.getElementById('video-container').innerHTML = 
                `<iframe src="${embedUrl}" 
                         allow="autoplay; encrypted-media; picture-in-picture" 
                         referrerpolicy="strict-origin-when-cross-origin" 
                         allowfullscreen></iframe>`;
        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
