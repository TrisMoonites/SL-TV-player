<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - SimCaster API Edition</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #000; 
        }
        #video-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            overflow: hidden;
        }
        /* Ihre bewährte Kinostreckung, angepasst an den API-Player */
        #ytplayer { 
            position: absolute;
            width: 100% !important; 
            height: 100% !important; 
            border: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.05, 1.85);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="ytplayer"></div>
    </div>

    <script>
        // 1. Logik aus Ihrem Original-Skript: URL-Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        let vID = urlParams.get('v');
        const listID = urlParams.get('list');
        
        // Liest die exakte Startsekunde aus, die das LSL-Skript mitsendet
        const startTime = parseInt(urlParams.get('t')) || 0;

        let targetVideoId = "koZceFeTJRU"; // Standard-Video falls leer
        let playlistId = "";

        // 2. Logik aus Ihrem Original-Skript: IDs, Listen und Suchfunktion verarbeiten
        if (vID) {
            if (vID.includes(',')) {
                // Listen aus Notecards (v=ID1,ID2,ID3)
                const ids = vID.split(',');
                targetVideoId = ids[0];
                playlistId = vID; // Übergibt die Kette als Playlist für den Loop
            } else if (vID.length < 15) {
                // Standard Einzelvideo
                targetVideoId = vID;
                playlistId = vID;
            } else {
                // Suchfunktion
                if (vID.startsWith("/watch?v=")) {
                    targetVideoId = vID.split('v=')[1];
                } else {
                    targetVideoId = vID;
                }
            }
        }

        // 3. SimCaster-Methode: YouTube API Script dynamisch nachladen (KORRIGIERT!)
        var tag = document.createElement("script");
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName("script")[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 4. SimCaster-Methode: Player mit Unterdrückung von Overlays und Werbung initialisieren
        var player;
        function onYouTubePlayerAPIReady() {
            let playerConfig = {
                height: "100%",
                width: "100%",
                videoId: targetVideoId,
                playerVars: {
                    autoplay: 1,
                    mute: 0,
                    rel: 0,
                    iv_load_policy: 3, // Schaltet Video-Anmerkungen und Overlays ab
                    fs: 1,
                    modestbranding: 1,
                    start: startTime // Zwingt den Player, exakt bei der übergebenen Sekunde zu starten
                }
            };

            // Wenn eine Notecard-Liste existiert, hängen wir sie als Playlist an den Player an
            if (playlistId) {
                playerConfig.playerVars.playlist = playlistId;
                playerConfig.playerVars.loop = 1;
            }
            // Wenn eine echte YouTube-Playlist (list=) übergeben wurde
            if (listID) {
                delete playerConfig.videoId; // videoId löschen, da list Vorrang hat
                playerConfig.playerVars.listType = 'playlist';
                playerConfig.playerVars.list = listID;
            }

            player = new YT.Player("ytplayer", playerConfig);
        }

        // Link-Fixer von SimCaster (verhindert das Ausbrechen aus dem Viewer)
        var a = document.getElementsByTagName("a");
        for (i=0; i<a.length; i++) { if (a[i].target="_blank") a[i].target="_self" }
    </script>
</body>
</html>
