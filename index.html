<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Loop Edition (Plyr Dynamic)</title>
    
    <!-- Plyr CSS für die werbefreie Oberfläche -->
    <link rel="stylesheet" href="https://plyr.io" />

   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    /* Zwingt das Plyr-Framework exakt in deinen originalen Zoom-Schnitt */
    .plyr, .plyr__video-wrapper, .plyr__video-embed { 
        position: absolute;
        width: 100% !important; 
        height: 100% !important; 
        border: none;
        top: 50%;
        left: 50%;
        /* Dein bewährter Zoom-Trick gegen Ränder im SL-Viewer */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <div id="video-container"></div>

    <!-- Plyr JavaScript Bibliothek laden -->
    <script src="https://plyr.io"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vID = urlParams.get('v');
        const listID = urlParams.get('list');

        let targetID = "";

        // Deine originale Logik filtert jetzt die sauberen IDs für Plyr heraus
        if (listID) {
            // Support für Playlists: Wir isolieren die reine ID (löscht eventuelles "list=")
            targetID = listID.replace('list=', '');
        } else if (vID) {
            if (vID.includes(',')) {
                // Notecard-Listen: Plyr startet mit der ersten ID aus dem Split
                const ids = vID.split(',');
                targetID = ids[0];
            } else if (vID.length < 15) {
                // Standard Einzelvideo
                targetID = vID;
            } else {
                // Support für Suchfunktion
                if (vID.startsWith("/watch?v=")) {
                    targetID = vID.split('v=')[1];
                } else {
                    targetID = vID;
                }
            }
        }

        // Wenn eine ID ermittelt wurde, bauen wir den Player passgenau auf
        if (targetID) {
            const container = document.getElementById('video-container');
            
            // Plyr verlangt ein frisches Div mit passenden Attributen statt eines Iframes
            const playerDiv = document.createElement('div');
            playerDiv.id = 'player';
            playerDiv.setAttribute('data-plyr-provider', 'youtube');
            
            // Wenn es eine Playlist ist, übergeben wir die Playlist-Embed-Struktur an Plyr
            if (listID) {
                playerDiv.setAttribute('data-plyr-embed-id', 'https://youtube.com' + targetID);
            } else {
                playerDiv.setAttribute('data-plyr-embed-id', targetID);
            }
            
            container.appendChild(playerDiv);

            // Plyr initialisieren und deine Anti-Werbe-Parameter übergeben
            const player = new Plyr('#player', {
                autoplay: true,
                muted: false,
                loop: { active: true },
                // Steuert YouTube im Hintergrund an (Verhindert Overlays, zwingt US-Server gegen Ads)
                youtube: { 
                    noCookie: true, 
                    rel: 0, 
                    showinfo: 0, 
                    iv_load_policy: 3, 
                    modestbranding: 1,
                    hl: 'en',
                    gl: 'US'
                }
            });

            // Erzwingt den Autoplay-Befehl im CEF-Viewer von Second Life, sobald geladen
            player.on('ready', () => {
                player.play();
            });

        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
