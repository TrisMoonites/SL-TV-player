<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Plyr Fixed Edition</title>
    
    <!-- Plyr CSS Stylesheet für die werbefreie Oberfläche -->
    <link rel="stylesheet" href="https://plyr.io" />

   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    /* Plyr-Container exakt so strecken wie Ihren alten Iframe */
    .plyr, .plyr__video-wrapper, .plyr__video-embed { 
        position: absolute;
        width: 100% !important; 
        height: 100% !important; 
        top: 50%;
        left: 50%;
        /* Ihr originaler Zoom-Trick für das SL-Seitenverhältnis */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <div id="video-container">
        <div id="player"></div>
    </div>

    <!-- Plyr JavaScript Bibliothek laden -->
    <script src="https://plyr.io"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let vID = urlParams.get('v');
        const listID = urlParams.get('list');

        let finalID = "";
        let isPlaylist = false;

        // IDs exakt isolieren, damit Plyr sie verarbeiten kann
        if (listID) {
            // Falls es eine echte Playlist ist, isolieren wir die Listen-ID
            // Falls das Inworld-Skript "list=PL..." schickt, filtern wir das "list=" heraus
            finalID = listID.includes('list=') ? listID.split('list=')[1] : listID;
            isPlaylist = true;
        } else if (vID) {
            if (vID.includes(',')) {
                // Notecard-Liste: Plyr nimmt das erste Video als Startvideo
                const ids = vID.split(',');
                finalID = ids[0];
            } else if (vID.startsWith("/watch?v=")) {
                // Suchfunktion-Filter
                finalID = vID.split('v=')[1];
            } else {
                // Standard Einzelvideo
                finalID = vID;
            }
        }

        if (finalID) {
            const playerDiv = document.getElementById('player');
            
            // Plyr mit den sauberen IDs füttern
            playerDiv.setAttribute('data-plyr-provider', 'youtube');
            playerDiv.setAttribute('data-plyr-embed-id', finalID);

            // Aktiviert den Player und übergibt die YouTube-Parameter direkt als API-Objekt
            const player = new Plyr('#player', {
                autoplay: true,
                muted: false,
                loop: { active: true },
                // Hier übergeben wir Ihre originalen Schutz-Parameter direkt an die YouTube-Schnittstelle von Plyr
                youtube: { 
                    noCookie: true, 
                    rel: 0, 
                    showinfo: 0, 
                    iv_load_policy: 3, 
                    modestbranding: 1,
                    hl: 'en',
                    gl: 'US'
                }
            });

            // Erzwingt den Autoplay-Start im integrierten CEF-Browser von Second Life
            player.on('ready', () => {
                player.play();
            });
        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
