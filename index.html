<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Loop Edition (SimCaster Fixed)</title>
   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    iframe { 
        position: absolute;
        width: 100% !important; 
        height: 100% !important; 
        border: none;
        top: 50%;
        left: 50%;
        /* Dein bewährter, originaler Zoom-Trick für das SL-Seitenverhältnis */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <div id="video-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vID = urlParams.get('v');
        const listID = urlParams.get('list');

        let embedUrl = "";
        
        // Wir nutzen die native YouTube-Embed-Domain. Das garantiert, dass der SL-Viewer
        // NIEMALS schwarz bleibt, da Google diese Verbindungen immer zulässt.
        const baseDomain = "https://www.youtube.com";
        
        // DAS SCHILD GEGEN WERBUNG:
        // modestbranding=1 -> Löscht alle YouTube-Logos
        // iv_load_policy=3 -> Blockiert vorgeschaltete Werbe-Overlays und Banner
        // rel=0 -> Verhindert das Laden fremder Werbe-Vorschläge am Ende
        // controls=1 -> Lädt die native Player-Steuerung (für Stabilität)
        const tvShieldParams = "&autoplay=1&mute=0&rel=0&modestbranding=1&iv_load_policy=3&controls=1";

        if (listID) {
            // Unterstützung für echte YouTube Playlists (list=)
            const cleanList = listID.replace('list=', '');
            embedUrl = baseDomain + "/embed/videoseries?list=" + cleanList + tvShieldParams;
        } else if (vID) {
            if (vID.includes(',')) {
                // Unterstützung für Listen aus Notecards (v=ID1,ID2,ID3)
                const ids = vID.split(',');
                embedUrl = baseDomain + "/embed/" + ids[0] + "?" + tvShieldParams + "&loop=1&playlist=" + vID;
            } else if (vID.length < 15) {
                // Standard Einzelvideo-Loop
                embedUrl = baseDomain + "/embed/" + vID + "?" + tvShieldParams + "&loop=1&playlist=" + vID;
            } else {
                // Unterstützung für die Suchfunktion
                if (vID.startsWith("/watch?v=")) {
                    const searchID = vID.split('v=')[1];
                    embedUrl = baseDomain + "/embed/" + searchID + "?" + tvShieldParams;
                } else {
                    embedUrl = baseDomain + "/embed/" + vID + "?" + tvShieldParams;
                }
            }
        }

        if (embedUrl) {
            // Erzeugt den nativen Iframe, den Second Life sofort hell schaltet
            document.getElementById('video-container').innerHTML = 
                `<iframe src="${embedUrl}" 
                         allow="autoplay; encrypted-media; picture-in-picture" 
                         referrerpolicy="strict-origin-when-cross-origin" 
                         allowfullscreen></iframe>`;
        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
