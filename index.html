<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Loop Edition (Plyr Upgrade)</title>
    
    <!-- NEU: Plyr CSS Stylesheet für die werbefreie Oberfläche -->
    <link rel="stylesheet" href="https://plyr.io" />

   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    /* Plyr-Container exakt so strecken wie Ihren alten Iframe */
    .plyr, .plyr__video-wrapper, .plyr__video-embed { 
        position: absolute;
        width: 100% !important; 
        height: 100% !important; 
        top: 50%;
        left: 50%;
        /* Ihr originaler Zoom-Trick für das SL-Seitenverhältnis */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <!-- Geändert: Plyr benötigt ein leeres Div mit einer ID statt des Iframes -->
    <div id="video-container">
        <div id="player"></div>
    </div>

    <!-- NEU: Plyr JavaScript Bibliothek laden -->
    <script src="https://plyr.io"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vID = urlParams.get('v');
        const listID = urlParams.get('list');

        let embedUrl = "";
        const baseDomain = "https://www.youtube-nocookie.com";
        const globalParams = "&hl=en&gl=US";

        // Ihre originale URL-Logik bleibt komplett erhalten!
        if (listID) {
            embedUrl = baseDomain + "/embed/videoseries?" + listID + "&autoplay=1&mute=0&rel=0&modestbranding=1" + globalParams;
        } else if (vID) {
            if (vID.includes(',')) {
                const ids = vID.split(',');
                embedUrl = baseDomain + "/embed/" + ids[0] + "?autoplay=1&mute=0&rel=0&modestbranding=1&loop=1&playlist=" + vID + globalParams;
            } else if (vID.length < 15) {
                embedUrl = baseDomain + "/embed/" + vID + "?autoplay=1&mute=0&rel=0&modestbranding=1&loop=1&playlist=" + vID + globalParams;
            } else {
                if (vID.startsWith("/watch?v=")) {
                    embedUrl = baseDomain + "/embed/" + vID.split('v=')[1] + "?autoplay=1&mute=0&rel=0&modestbranding=1" + globalParams;
                } else {
                    embedUrl = baseDomain + "/embed/" + vID + "?autoplay=1&mute=0&rel=0&modestbranding=1" + globalParams;
                }
            }
        }

        if (embedUrl) {
            const playerDiv = document.getElementById('player');
            
            // Plyr füttern: Wir übergeben Ihre generierte URL direkt an die API
            playerDiv.setAttribute('data-plyr-provider', 'youtube');
            playerDiv.setAttribute('data-plyr-embed-id', embedUrl);

            // Aktiviert den Player mit Werbe-Unterdrückung
            const player = new Plyr('#player', {
                autoplay: true,
                muted: false,
                loop: { active: true },
                // Verhindert zusätzliche Youtube-Overlays im SL-Viewer
                youtube: { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }
            });

            // Erreicht das automatische Abspielen im CEF-Browser von Second Life
            player.on('ready', () => {
                player.play();
            });
        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
