<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Interactive Edition</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #000; 
        }
        #video-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            overflow: hidden;
        }
        /* Kinostreckung angepasst mit sichtbarer Interaktion */
        #ytplayer { 
            position: absolute;
            width: 100% !important; 
            height: 100% !important; 
            border: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.02, 1.02); /* Leicht skaliert damit Buttons erreichbar bleiben */
            pointer-events: auto !important; /* Stellt sicher dass Klicks in SL durchgehen */
        }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="ytplayer" allow="autoplay; encrypted-media; picture-in-picture; accelerometer; gyroscope" allowfullscreen></iframe>
    </div>

    <script>
        // 1. URL-Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        let vID = urlParams.get('v');
        const listID = urlParams.get('list');
        const startTime = parseInt(urlParams.get('t')) || 0;

        let targetVideoId = "koZceFeTJRU"; 
        let playlistId = "";

        // 2. IDs und Listen verarbeiten
        if (vID) {
            if (vID.includes(',')) {
                const ids = vID.split(',');
                targetVideoId = ids[0];
                playlistId = vID; 
            } else if (vID.length < 15) {
                targetVideoId = vID;
                playlistId = vID;
            } else {
                if (vID.startsWith("/watch?v=")) {
                    targetVideoId = vID.split('v=')[1];
                } else {
                    targetVideoId = vID;
                }
            }
        }

        // 3. YouTube Player mit vollen Steuerungselementen (controls=1, fs=1, disablekb=0)
        // Dadurch erscheint der reguläre "Werbung überspringen"-Button unten rechts
        const BASE_URL = "https://www.youtube-nocookie.com/embed/";
        
        // controls=1 -> Blendet Bedienelemente & Überspringen-Button ein
        // modestbranding=0 -> Zeigt YouTube-UIlemente damit Skip-Buttons gerendert werden
        const playerParams = "?autoplay=1&controls=1&fs=1&rel=0&iv_load_policy=3&enablejsapi=1&start=" + startTime;

        let embedUrl = "";

        if (listID) {
            embedUrl = BASE_URL + targetVideoId + playerParams + "&list=" + listID;
        } else if (playlistId && playlistId.includes(',')) {
            embedUrl = BASE_URL + targetVideoId + playerParams + "&playlist=" + playlistId + "&loop=1";
        } else {
            embedUrl = BASE_URL + targetVideoId + playerParams;
        }

        // 4. In Iframe laden
        const playerIframe = document.getElementById("ytplayer");
        playerIframe.src = embedUrl;

        // Link-Fixer von SimCaster
        var a = document.getElementsByTagName("a");
        for (i=0; i<a.length; i++) { if (a[i].target="_blank") a[i].target="_self" }
    </script>
</body>
</html>
