<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Loop Edition (SimCaster Method Fixed)</title>
   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    iframe { 
        position: absolute;
        width: 100% !important; 
        height: 100% !important; 
        border: none;
        top: 50%;
        left: 50%;
        /* Dein bewährter, originaler Zoom-Trick für das SL-Seitenverhältnis */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <div id="video-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vID = urlParams.get('v');
        const listID = urlParams.get('list');

        // Die ultimative SimCaster-Lösung: Eine Liste von Servern ohne aggressive Cloudflare-Sperren.
        // Wenn ein Server blockiert, schaltet das System automatisch unsichtbar weiter.
        const backupDomains = [
            "https://melmac.space",
            "https://nerdvpn.de",
            "https://no-logs.com",
            "https://tux.im",
            "https://perennialte.ch"
        ];
        
        let currentInstanceIndex = 0;
        let finalPath = "";

        // Deine originale Logik ermittelt den Pfad, unabhängig von der Domain
        if (listID) {
            const cleanList = listID.replace('list=', '');
            finalPath = "/embed/playlist?list=" + cleanList + "&autoplay=1";
        } else if (vID) {
            if (vID.includes(',')) {
                const ids = vID.split(',');
                finalPath = "/embed/" + ids[0] + "?autoplay=1&loop=1";
            } else if (vID.length < 15) {
                finalPath = "/embed/" + vID + "?autoplay=1&loop=1";
            } else {
                if (vID.startsWith("/watch?v=")) {
                    finalPath = "/embed/" + vID.split('v=')[1] + "?autoplay=1";
                } else {
                    finalPath = "/embed/" + vID + "?autoplay=1";
                }
            }
        }

        // Funktion, die den Iframe mit dem aktuellen Server lädt
        function loadVideoPlayer(index) {
            if (index >= backupDomains.length) {
                document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Alle werbefreien Server ausgelastet. Bitte neu laden.</h2>';
                return;
            }

            const activeDomain = backupDomains[index];
            const fullUrl = activeDomain + finalPath;

            const container = document.getElementById('video-container');
            container.innerHTML = `
                <iframe id="sl-tv-frame" src="${fullUrl}" 
                        allow="autoplay; encrypted-media; picture-in-picture" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                </iframe>`;

            // Sicherheitsnetz: Falls der Viewer die Seite nicht laden kann (z.B. wegen verdecktem Cloudflare),
            // wartet das Skript 4 Sekunden. Bleibt es stumm oder bricht ab, springt es zum nächsten Server.
            const frame = document.getElementById('sl-tv-frame');
            
            // Wenn der Iframe geladen wird, prüfen wir kurz, ob wir eine Fehlermeldung verhindern müssen
            frame.onerror = function() {
                tryNextServer();
            };
        }

        function tryNextServer() {
            currentInstanceIndex++;
            loadVideoPlayer(currentInstanceIndex);
        }

        if (finalPath) {
            // Starte mit dem ersten offenen Server
            loadVideoPlayer(currentInstanceIndex);
        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
