<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SimCaster-Core: Erzwingt die korrekte Herkunftsübermittlung für den SL-Viewer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - Loop Edition</title>
   <style>
    body, html { 
        margin: 0; padding: 0; height: 100%; width: 100%; 
        overflow: hidden; background-color: #000; 
    }
    #video-container { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        overflow: hidden;
    }
    iframe { 
        position: absolute;
        /* Wir machen den Iframe breiter und höher als nötig */
        width: 100% !important; 
        height: 100% !important; 
        border: none;
        top: 50%;
        left: 50%;
        /* 
           scale(1.05, 1.15) streckt das Video:
           1.05 = 5% breiter (X-Achse)
           1.15 = 15% höher (Y-Achse)
        */
        transform: translate(-50%, -50%) scale(1.05, 1.85);
    }
</style>
</head>
<body>
    <div id="video-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vID = urlParams.get('v');
        const listID = urlParams.get('list');

        let embedUrl = "";
        
        // Stabilisierte, werbefreie Open-Source-Spiegelinstanz (Invidious)
        // Lädt das Video werbefrei und bricht den unendlichen Ladekreis von YouTube auf
        const baseDomain = "https://asir.dev";
        
        // Player-Parameter für automatische Wiedergabe und Stummschaltungsausgleich
        const globalParams = "&autoplay=1&muted=0&quality=dash&listen=0";

        if (listID) {
            // Unterstützung für echte YouTube Playlists (list=)
            embedUrl = baseDomain + "/embed/videoseries?" + listID + globalParams;
        } else if (vID) {
            if (vID.includes(',')) {
                // Unterstützung für Listen aus Notecards (v=ID1,ID2,ID3)
                const ids = vID.split(',');
                embedUrl = baseDomain + "/embed/" + ids[0] + "?" + globalParams + "&playlist=" + vID + "&loop=1";
            } else if (vID.length < 15) {
                // Standard Einzelvideo-Loop
                embedUrl = baseDomain + "/embed/" + vID + "?" + globalParams + "&playlist=" + vID + "&loop=1";
            } else {
                // Unterstützung für die Suchfunktion (Punkt 6)
                if (vID.startsWith("/watch?v=")) {
                    embedUrl = baseDomain + "/embed/" + vID.split('v=')[1] + "?" + globalParams;
                } else {
                    embedUrl = baseDomain + "/embed/" + vID + "?" + globalParams;
                }
            }
        }

        if (embedUrl) {
            // Rettungscode: Sandbox gelöscht! Jetzt wird die Herkunft glasklar übertragen, das Smiley verschwindet.
            document.getElementById('video-container').innerHTML = 
                `<iframe src="${embedUrl}" 
                         allow="autoplay; encrypted-media; picture-in-picture" 
                         referrerpolicy="strict-origin-when-cross-origin" 
                         allowfullscreen></iframe>`;
        } else {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20%;font-family:Arial;">Warte auf Video-ID...</h2>';
        }
    </script>
</body>
</html>
