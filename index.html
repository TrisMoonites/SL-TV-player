<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - SimCaster API Edition</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #000; 
        }
        #video-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            overflow: hidden;
        }
        /* Ihre bewährte Kinostreckung, angepasst an den API-Player */
        #ytplayer { 
            position: absolute;
            width: 100% !important; 
            height: 100% !important; 
            border: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.05, 1.85);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="ytplayer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        // 1. Logik aus Ihrem Original-Skript: URL-Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        let vID = urlParams.get('v');
        const listID = urlParams.get('list');
        
        // NEU: Liest den Start-Zeitstempel aus, den das LSL-Skript mitsendet, um Nachzügler zu synchronisieren
        const startTime = parseInt(urlParams.get('t')) || 0;

        let targetVideoId = "koZceFeTJRU"; // Standard-Video falls leer
        let playlistId = "";

        // 2. Logik aus Ihrem Original-Skript: IDs, Listen und Suchfunktion verarbeiten
        if (vID) {
            if (vID.includes(',')) {
                // Listen aus Notecards (v=ID1,ID2,ID3)
                const ids = vID.split(',');
                targetVideoId = ids[0];
                playlistId = vID; // Übergibt die Kette als Playlist für den Loop
            } else if (vID.length < 15) {
                // Standard Einzelvideo
                targetVideoId = vID;
                playlistId = vID;
            } else {
                // Suchfunktion
                if (vID.startsWith("/watch?v=")) {
                    targetVideoId = vID.split('v=')[1];
                } else {
                    targetVideoId = vID;
                }
            }
        }

        // 3. YouTube No-Cookie Embed (Verhindert Bot-Sperren im SL-Viewer)
        const NOCOOKIE_BASE = "https://www.youtube-nocookie.com/embed/";
        let embedUrl = "";

        if (listID) {
            embedUrl = NOCOOKIE_BASE + targetVideoId + "?list=" + listID + "&autoplay=1&start=" + startTime + "&rel=0&iv_load_policy=3&modestbranding=1";
        } else if (playlistId && playlistId.includes(',')) {
            embedUrl = NOCOOKIE_BASE + targetVideoId + "?playlist=" + playlistId + "&autoplay=1&loop=1&start=" + startTime + "&rel=0&iv_load_policy=3&modestbranding=1";
        } else {
            embedUrl = NOCOOKIE_BASE + targetVideoId + "?autoplay=1&start=" + startTime + "&rel=0&iv_load_policy=3&modestbranding=1";
        }

        // 4. In das bestehende Iframe laden
        document.getElementById("ytplayer").src = embedUrl;

        // Link-Fixer von SimCaster (verhindert das Ausbrechen aus dem Viewer)
        var a = document.getElementsByTagName("a");
        for (i=0; i<a.length; i++) { if (a[i].target="_blank") a[i].target="_self" }
    </script>
</body>
</html>
