<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>SL TV Player 2026 - SimCaster API Edition</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #000; 
        }
        #video-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            overflow: hidden;
        }
        #ytplayer { 
            position: absolute;
            width: 100% !important; 
            height: 100% !important; 
            border: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.05, 1.85);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="ytplayer"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let vID = urlParams.get('v');
        const listID = urlParams.get('list');
        const startTime = parseInt(urlParams.get('t')) || 0;

        let targetVideoId = "koZceFeTJRU"; 
        let playlistId = "";

        if (vID) {
            if (vID.includes(',')) {
                const ids = vID.split(',');
                targetVideoId = ids[0]; // FIX: Holt die erste Text-ID aus dem Splitting heraus
                playlistId = vID; 
            } else if (vID.length < 15) {
                targetVideoId = vID;
                playlistId = vID;
            } else {
                if (vID.startsWith("/watch?v=")) {
                    targetVideoId = vID.split('v=')[1];
                } else {
                    targetVideoId = vID;
                }
            }
        }

        // SimCaster-Methode: API Script dynamisch an den korrekten Platz im DOM einfügen
        var tag = document.createElement("script");
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName("script")[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubePlayerAPIReady() {
            let playerConfig = {
                height: "100%",
                width: "100%",
                videoId: targetVideoId,
                playerVars: {
                    autoplay: 1,
                    mute: 0,
                    rel: 0,
                    iv_load_policy: 3, 
                    fs: 1,
                    modestbranding: 1,
                    start: startTime 
                }
            };

            if (playlistId) {
                playerConfig.playerVars.playlist = playlistId;
                playerConfig.playerVars.loop = 1;
            }
            if (listID) {
                delete playerConfig.videoId; 
                playerConfig.playerVars.listType = 'playlist';
                playerConfig.playerVars.list = listID;
            }

            player = new YT.Player("ytplayer", playerConfig);
        }

        var a = document.getElementsByTagName("a");
        for (i=0; i<a.length; i++) { if (a[i].target="_blank") a[i].target="_self" }
    </script>
</body>
</html>
